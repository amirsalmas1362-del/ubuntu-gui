name: Ubuntu RDP (XFCE) - Ultimate Debug

on:
  workflow_dispatch:
    inputs:
      trusted_ip:
        description: 'Your trusted IP for RDP (e.g., 1.2.3.4)'
        required: true
        default: '0.0.0.0/0'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ================================================
      # 1. به‌روزرسانی و نصب بسته‌ها
      # ================================================
      - name: 1. Update & Install
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y xfce4 xfce4-goodies xrdp dbus-x11 sudo

      # ================================================
      # 2. راه‌اندازی dbus
      # ================================================
      - name: 2. Start dbus
        run: |
          sudo systemctl enable dbus
          sudo systemctl start dbus

      # ================================================
      # 3. ایجاد کاربر NvDAdmin (با حروف دقیق)
      # ================================================
      - name: 3. Create NvDAdmin user (exact case)
        run: |
          # حذف کامل کاربر قبلی (اگر وجود داشت)
          sudo userdel -r NvDAdmin 2>/dev/null || true
          sudo userdel -r NvdAdmin 2>/dev/null || true  # حذف نسخه‌ی با d کوچک (احتمال خطا)
          
          # ایجاد کاربر جدید با حروف دقیق
          sudo useradd -m -s /bin/bash NvDAdmin
          echo "NvDAdmin:P@ssw0rd1qazXSW@#" | sudo chpasswd
          
          # اضافه به گروه‌ها
          sudo usermod -aG sudo,adm,xrdp,ssl-cert,video,audio NvDAdmin
          
          # تنظیم .xsession با startxfce4
          sudo -u NvDAdmin bash -c 'echo "startxfce4" > ~/.xsession'
          
          # ایجاد دایرکتوری .config برای جلوگیری از خطاهای بعدی
          sudo -u NvDAdmin mkdir -p ~/.config/xfce4-session
          
          echo "User NvDAdmin created successfully."
          id NvDAdmin

      # ================================================
      # 4. تست احراز هویت (قبل از راه‌اندازی xrdp)
      # ================================================
      - name: 4. Test authentication locally
        run: |
          echo "=== Testing local login for NvDAdmin ==="
          echo "P@ssw0rd1qazXSW@#" | sudo -S -u NvDAdmin whoami 2>&1 || echo "Authentication failed!"
          echo "=== Test completed ==="

      # ================================================
      # 5. تنظیم xrdp و sesman
      # ================================================
      - name: 5. Configure xrdp
        run: |
          # ایجاد فایل .xsession برای root و runner
          echo "startxfce4" | sudo tee /root/.xsession
          echo "startxfce4" | tee ~/.xsession
          
          # تنظیم sesman.ini
          sudo sed -i 's/^param=Xvnc/param=Xorg/' /etc/xrdp/sesman.ini
          sudo sed -i 's/^param=Xorg/param=Xorg/' /etc/xrdp/sesman.ini
          sudo sed -i 's/^allow_root_login=.*/allow_root_login=true/' /etc/xrdp/sesman.ini
          sudo sed -i 's/^timeout=.*/timeout=300/' /etc/xrdp/sesman.ini
          
          # تنظیم xrdp.ini
          sudo sed -i 's/^use_vsock=.*/use_vsock=false/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^port=3389/port=3389/' /etc/xrdp/xrdp.ini

      # ================================================
      # 6. راه‌اندازی مجدد سرویس‌ها
      # ================================================
      - name: 6. Restart services
        run: |
          sudo systemctl restart dbus
          sudo systemctl restart xrdp
          sudo systemctl restart xrdp-sesman
          sleep 3
          sudo systemctl status xrdp --no-pager

      # ================================================
      # 7. فایروال (UFW)
      # ================================================
      - name: 7. Configure UFW
        run: |
          TRUSTED_IP="${{ github.event.inputs.trusted_ip }}"
          sudo ufw allow from $TRUSTED_IP to any port 3389
          sudo ufw allow from $TRUSTED_IP to any port 22
          echo "y" | sudo ufw enable
          sudo ufw status verbose

      # ================================================
      # 8. نصب Tailscale و اتصال
      # ================================================
      - name: 8. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-rdp-server" --accept-routes
          sleep 5
          ts_ip=$(sudo tailscale ip -4)
          
          echo ""
          echo -e "\e[32m==================================================\e[0m"
          echo -e "\e[36m  >>> RDP SERVER IS READY! <<<\e[0m"
          echo -e "\e[33m  Tailscale IP : $ts_ip\e[0m"
          echo -e "\e[33m  Username     : NvDAdmin\e[0m"
          echo -e "\e[33m  Password     : P@ssw0rd1qazXSW@#\e[0m"
          echo -e "\e[35m  >> Open mstsc and connect to: $ts_ip\e[0m"
          echo -e "\e[33m  >> CRITICAL: Username is CASE-SENSITIVE! Type 'NvDAdmin' exactly.\e[0m"
          echo -e "\e[32m==================================================\e[0m"
          
          echo "TS_IP=$ts_ip" >> $GITHUB_ENV

      # ================================================
      # 9. نمایش کامل لاگ‌ها برای عیب‌یابی
      # ================================================
      - name: 9. Show full logs for debugging
        run: |
          echo "==================== /var/log/xrdp.log ===================="
          sudo cat /var/log/xrdp.log | tail -30
          echo ""
          echo "==================== /var/log/xrdp-sesman.log ===================="
          sudo cat /var/log/xrdp-sesman.log | tail -30
          echo ""
          echo "==================== /var/log/auth.log (last 10 lines) ===================="
          sudo tail -10 /var/log/auth.log

      # ================================================
      # 10. زنده نگه‌داشتن
      # ================================================
      - name: 10. Keep Alive
        run: |
          echo "Server is up. Check the logs above if you face login issues."
          for ((i=1; i<=360; i++)); do
            sleep 60
            echo "[$i/360] Server running... (IP: ${{ env.TS_IP }})"
          done
